<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>dilseSuno | Piku AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #141b36 0%, #080a14 100%);
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 14, 28, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      z-index: 10;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub { font-size: 0.7rem; color: #94a3b8; }
    .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .streak-badge {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #fb923c;
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .mode-bar {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      background: rgba(8, 10, 20, 0.5);
    }
    .mode-bar::-webkit-scrollbar { display: none; }

    .mode-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      transition: all 0.2s ease;
    }

    .mode-chip.active {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      border-color: #60a5fa;
      color: #fff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
    }

    .mode-chip.study-chip.active {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      border-color: #fcd34d;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    }

    .avatar-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0 6px;
      position: relative;
    }

    .avatar-img {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      animation: floatBot 3.5s ease-in-out infinite;
    }

    @keyframes floatBot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-row { display: flex; flex-direction: column; max-width: 82%; }
    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.bot { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .msg-row.user .bubble {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.bot .bubble {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
    }

    .bubble-actions { display: flex; gap: 8px; margin-top: 4px; font-size: 0.7rem; }
    .edit-btn { background: none; border: none; color: #94a3b8; cursor: pointer; }
    .edit-btn:hover { color: #38bdf8; }

    .thinking-bubble {
      display: none;
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 0.78rem;
      color: #94a3b8;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #38bdf8;
      border-radius: 50%;
      animation: pulseAnim 1.2s infinite ease-in-out;
    }
    .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
    .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulseAnim {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    .img-preview-box {
      display: none;
      padding: 6px 16px;
      background: rgba(15, 23, 42, 0.9);
      align-items: center;
      gap: 10px;
    }
    .preview-thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
    .cancel-thumb { background: #ef4444; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; }

    .input-bar {
      padding: 10px 14px;
      background: rgba(10, 14, 28, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-action-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.05rem;
      flex-shrink: 0;
    }
    .icon-action-btn.listening {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ef4444;
      animation: micPulse 1s infinite alternate;
    }

    @keyframes micPulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    .text-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      border: none;
      color: #fff;
      padding: 9px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    #cameraInput, #galleryInput { display: none; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">DILSESUNO</div>
      <div class="brand-sub">by snyax.ai</div>
    </div>
    <div class="badges">
      <div class="streak-badge">🔥 3-Day Vent Streak</div>
    </div>
  </header>

  <div class="mode-bar">
    <div class="mode-chip" id="voiceToggleBtn" onclick="toggleVoiceMode()">🎙️ Voice: ON</div>
    <div class="mode-chip active" onclick="switchMode('dilse', this)">❤️ Dil Se</div>
    <div class="mode-chip study-chip" onclick="switchMode('study', this)">📚 Study Buddy</div>
    <div class="mode-chip" onclick="switchMode('bhai', this)">🤝 Real Talk</div>
    <div class="mode-chip" onclick="switchMode('hype', this)">⚡ Hype Up</div>
    <div class="mode-chip" onclick="switchMode('roast', this)">🔥 Roast</div>
    <div class="mode-chip" onclick="switchMode('gossip', this)">👀 Gossip</div>
  </div>

  <div class="avatar-wrap">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=PikuBot" class="avatar-img" alt="Piku Avatar" />
  </div>

  <div class="chat-container" id="chatContainer"></div>

  <div class="thinking-bubble" id="thinkingBubble">
    <span>Piku is thinking</span>
    <div class="pulse-dot"></div>
    <div class="pulse-dot"></div>
    <div class="pulse-dot"></div>
  </div>

  <div class="img-preview-box" id="imgPreviewBox">
    <img id="previewImg" class="preview-thumb" src="" alt="Selected Photo" />
    <span style="font-size:0.75rem; color:#94a3b8;">Photo attached</span>
    <button class="cancel-thumb" onclick="removeImage()">✕</button>
  </div>

  <div class="input-bar">
    <!-- Camera Button (Direct Camera Trigger) -->
    <button class="icon-action-btn" title="Take Photo" onclick="document.getElementById('cameraInput').click()">📸</button>
    <!-- Gallery Button -->
    <button class="icon-action-btn" title="Open Gallery" onclick="document.getElementById('galleryInput').click()">🖼️</button>
    <!-- Mic Button (Speech-to-Text & Wake Word) -->
    <button class="icon-action-btn" id="micBtn" title="Speak" onclick="toggleSpeechRecognition()">🎤</button>
    
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImagePicked(event)" />
    <input type="file" id="galleryInput" accept="image/*" onchange="handleImagePicked(event)" />

    <input type="text" id="userInput" class="text-input" placeholder="Type or say 'Piku'..." onkeydown="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    let currentMode = 'dilse';
    let voiceEnabled = true;
    let currentBase64Image = null;
    let editingMessageId = null;
    let isListening = false;
    let recognition = null;

    let companionChat = JSON.parse(localStorage.getItem('piku_companion_chat') || '[]');
    let studyChat = JSON.parse(localStorage.getItem('piku_study_chat') || '[]');
    let userProfile = JSON.parse(localStorage.getItem('piku_user_profile') || '{"name":"","nickname":""}');
    let lastContextTopic = localStorage.getItem('piku_last_topic') || '';

    if (companionChat.length === 0) {
      companionChat.push({ id: Date.now(), sender: 'bot', text: "Yo! Main Piku hoon. Jo dil mein hai bina filter bol 🤍" });
    }
    if (studyChat.length === 0) {
      studyChat.push({ id: Date.now(), sender: 'bot', text: "Study Workspace active hai! Koi bhi problem, doubt ya photo bhejo 📚" });
    }

    function renderChat() {
      const container = document.getElementById('chatContainer');
      container.innerHTML = '';
      const activeList = (currentMode === 'study') ? studyChat : companionChat;

      activeList.forEach(msg => {
        const row = document.createElement('div');
        row.className = `msg-row ${msg.sender}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = msg.text;
        row.appendChild(bubble);

        if (msg.sender === 'user') {
          const actions = document.createElement('div');
          actions.className = 'bubble-actions';
          actions.innerHTML = `<button class="edit-btn" onclick="editMessage(${msg.id})">✏️ Edit</button>`;
          row.appendChild(actions);
        }
        container.appendChild(row);
      });
      container.scrollTop = container.scrollHeight;
    }

    function switchMode(newMode, element) {
      currentMode = newMode;
      document.querySelectorAll('.mode-chip').forEach(c => {
        if (c.id !== 'voiceToggleBtn') c.classList.remove('active');
      });
      element.classList.add('active');
      renderChat();
    }

    function handleImagePicked(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        currentBase64Image = evt.target.result;
        document.getElementById('previewImg').src = currentBase64Image;
        document.getElementById('imgPreviewBox').style.display = 'flex';
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function removeImage() {
      currentBase64Image = null;
      document.getElementById('imgPreviewBox').style.display = 'none';
    }

    function editMessage(msgId) {
      const activeList = (currentMode === 'study') ? studyChat : companionChat;
      const targetIndex = activeList.findIndex(m => m.id === msgId);
      if (targetIndex === -1) return;
      document.getElementById('userInput').value = activeList[targetIndex].text;
      editingMessageId = msgId;
      document.getElementById('userInput').focus();
    }

    function toggleVoiceMode() {
      voiceEnabled = !voiceEnabled;
      const btn = document.getElementById('voiceToggleBtn');
      btn.innerText = voiceEnabled ? "🎙️ Voice: ON" : "🔇 Voice: OFF";
      btn.classList.toggle('active', voiceEnabled);
      if (!voiceEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function speakText(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const cleanVoiceText = text
        .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '')
        .replace(/[*_~`#]/g, '')
        .trim();

      if (!cleanVoiceText) return;
      const utterance = new SpeechSynthesisUtterance(cleanVoiceText);
      utterance.rate = 0.95;
      utterance.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const hindiVoice = voices.find(v => v.lang.includes('hi') || v.lang.includes('IN'));
      if (hindiVoice) utterance.voice = hindiVoice;
      window.speechSynthesis.speak(utterance);
    }

    // 8. SPEECH-TO-TEXT & "PIKU" WAKE-WORD LOGIC
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'hi-IN';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        const lower = transcript.toLowerCase();

        // Wake word detection
        if (lower.includes('piku')) {
          speakText("Haan bol bhai, sun raha hoon!");
          const cleanedText = transcript.replace(/piku/gi, '').trim();
          if (cleanedText) {
            document.getElementById('userInput').value = cleanedText;
            sendMessage();
          }
        } else {
          document.getElementById('userInput').value = transcript;
          sendMessage();
        }
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };

      recognition.onerror = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };
    }

    function toggleSpeechRecognition() {
      if (!recognition) setupSpeechRecognition();
      if (!recognition) {
        alert("Browser does not support Speech Recognition. Use Chrome/Safari.");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    // 9. SEND MESSAGE LOGIC
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      const attachedImage = currentBase64Image;

      if (!text && !attachedImage) return;

      let activeList = (currentMode === 'study') ? studyChat : companionChat;

      if (editingMessageId) {
        const editIdx = activeList.findIndex(m => m.id === editingMessageId);
        if (editIdx !== -1) activeList.splice(editIdx);
        editingMessageId = null;
      }

      activeList.push({ id: Date.now(), sender: 'user', text: text || "Attached Photo" });
      input.value = '';
      removeImage();
      renderChat();

      const thinking = document.getElementById('thinkingBubble');
      thinking.style.display = 'inline-flex';
      document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            mode: currentMode,
            lastContext: (currentMode === 'study') ? '' : lastContextTopic,
            userProfile: userProfile,
            voiceEnabled: voiceEnabled,
            imageBase64: attachedImage
          })
        });

        const data = await res.json();
        thinking.style.display = 'none';

        const reply = data.text || "Yaar, ek baar dobara bolna!";
        activeList.push({ id: Date.now(), sender: 'bot', text: reply });

        if (data.extractedName) userProfile.name = data.extractedName;
        if (data.nickname) userProfile.nickname = data.nickname;
        localStorage.setItem('piku_user_profile', JSON.stringify(userProfile));

        if (currentMode !== 'study' && data.memoryTopic) {
          lastContextTopic = data.memoryTopic;
          localStorage.setItem('piku_last_topic', lastContextTopic);
        }

        if (currentMode === 'study') {
          localStorage.setItem('piku_study_chat', JSON.stringify(studyChat));
        } else {
          localStorage.setItem('piku_companion_chat', JSON.stringify(companionChat));
        }

        renderChat();
        speakText(reply);

      } catch (err) {
        thinking.style.display = 'none';
        activeList.push({ id: Date.now(), sender: 'bot', text: "Connection issue hai yaar, ek baar check kar le!" });
        renderChat();
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
    setupSpeechRecognition();
    renderChat();
  </script>
</body>
</html>
