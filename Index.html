<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DilSeSuno by snyax.ai</title>

  <!-- Google Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #030014;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    #starsCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 10px;
    }

    /* Header */
    .open-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
      width: 100%;
    }

    .brand-title-box {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f0ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 10px;
      color: #00f0ff;
      letter-spacing: 1px;
      font-weight: 600;
      opacity: 0.9;
    }

    .status-ticker {
      font-size: 11px;
      color: #c084fc;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .streak-badge {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 11px;
    }

    /* Mode Navigation Pills */
    .pills-wrapper {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 2px;
      scrollbar-width: none;
      z-index: 2;
    }
    .pills-wrapper::-webkit-scrollbar { display: none; }

    .pill {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: #00f0ff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
    }

    .pill.active {
      background: linear-gradient(135deg, #00f0ff, #8b5cf6);
      color: #000;
      font-weight: 700;
      border-color: #00f0ff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.5);
    }

    .pill.study-pill.active {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #000;
      border-color: #10b981;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
    }

    /* Main Workspace Container */
    .main-glass-card {
      background: rgba(8, 7, 26, 0.65);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.04);
      flex: 1;
      justify-content: space-between;
      position: relative;
    }

    /* 3D Model Stage */
    .stage-room {
      position: relative;
      width: 100%;
      height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: height 0.3s ease;
    }

    .stage-room.voice-mode-stage {
      height: 380px;
    }

    /* Study Mode minimizes avatar to give full focus to workspace */
    .stage-room.study-compact {
      height: 120px;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      z-index: 2;
      --poster-color: transparent;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.3));
      animation: floatIdle 3s infinite ease-in-out;
    }

    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .glowing-oval {
      position: absolute;
      bottom: 8px;
      width: 140px;
      height: 28px;
      background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.85) 0%, rgba(168, 85, 247, 0.35) 55%, transparent 80%);
      border-radius: 50%;
      border: 1.5px solid rgba(0, 240, 255, 0.7);
      box-shadow: 0 0 20px #00f0ff;
      pointer-events: none;
      z-index: 1;
      animation: ovalBreathing 3s infinite ease-in-out;
    }

    @keyframes ovalBreathing {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.06); opacity: 1; box-shadow: 0 0 28px #00f0ff; }
    }

    .stage-room.speaking model-viewer {
      filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.95)) drop-shadow(0 0 35px rgba(168, 85, 247, 0.75));
      animation: floatSpeaking 0.6s infinite alternate ease-in-out;
    }

    @keyframes floatSpeaking {
      from { transform: translateY(-2px) scale(1.01); }
      to { transform: translateY(-10px) scale(1.03); }
    }

    /* Isolated Study Buddy Notice Bar */
    .study-top-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: #6ee7b7;
    }

    /* Chat Area */
    .chat-box {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      scroll-behavior: smooth;
    }

    .chat-box.study-expanded {
      max-height: 360px;
    }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
    }

    .msg-row.user-row {
      justify-content: flex-end;
    }

    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      word-break: break-word;
      position: relative;
    }

    .msg.user {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-bottom-right-radius: 3px;
      color: #fff;
    }

    .msg.bot {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-bottom-left-radius: 3px;
      color: #e2e8f0;
    }

    .msg.study-bot-msg {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(6, 78, 59, 0.25);
    }

    .msg.crisis {
      background: rgba(220, 38, 38, 0.25);
      border: 1px solid #ef4444;
      color: #fecaca;
    }

    /* Edit Message Pencil Button */
    .edit-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 12px;
      opacity: 0.6;
      padding: 4px;
      transition: opacity 0.2s;
      align-self: center;
    }
    .edit-btn:hover { opacity: 1; color: #00f0ff; }

    /* Typing / Thinking Indicator */
    .thinking-bubble {
      display: none;
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 8px 14px;
      border-radius: 16px;
      font-size: 12px;
      color: #00f0ff;
      align-items: center;
      gap: 8px;
    }

    .dot-flashing {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 5px;
      background-color: #00f0ff;
      animation: dotPulse 1s infinite alternate;
    }
    @keyframes dotPulse {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Attached image preview pill */
    .attached-preview-box {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: #6ee7b7;
      width: fit-content;
    }

    .remove-img-btn {
      cursor: pointer;
      color: #f87171;
      font-weight: bold;
      margin-left: 4px;
    }

    .chat-img-thumb {
      max-width: 140px;
      max-height: 140px;
      border-radius: 8px;
      margin-bottom: 6px;
      border: 1px solid rgba(0, 240, 255, 0.4);
      display: block;
    }

    /* Input Bar */
    .input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-area {
      display: flex;
      gap: 6px;
      padding: 6px 8px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 25px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      align-items: center;
    }

    .action-icon-btn {
      cursor: pointer;
      font-size: 17px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00f0ff;
      background: transparent;
      border: none;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .action-icon-btn:hover { background: rgba(0, 240, 255, 0.15); }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      padding: 8px 10px;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    button.send-btn {
      background: linear-gradient(135deg, #00f0ff, #8b5cf6);
      border: none;
      color: #000;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }

    /* Voice Mode Tap-to-Talk Button */
    .voice-talk-btn-container {
      display: none;
      width: 100%;
      padding: 8px 0;
    }

    .tap-to-talk-btn {
      width: 100%;
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      border: none;
      color: #000;
      padding: 16px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      transition: all 0.2s ease;
    }
    .tap-to-talk-btn:active { transform: scale(0.98); }

    footer {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: #64748b;
    }
    footer a { color: #00f0ff; text-decoration: none; }
  </style>
</head>
<body>

  <canvas id="starsCanvas"></canvas>

  <div class="app-container">

    <!-- Header -->
    <div class="open-header">
      <div class="brand-title-box">
        <div class="brand-title">DilSeSuno</div>
        <div class="brand-subtitle">by snyax.ai</div>
      </div>
      <div class="status-ticker">
        <span class="streak-badge" id="streakBadge">🔥 1-Day Vent Streak</span>
        <span>🌙 <span id="onlineCount">38</span> online</span>
      </div>
    </div>

    <!-- Mode Pills -->
    <div class="pills-wrapper">
      <button onclick="setMode('voice', this)" class="pill active">🎙️ Voice Mode</button>
      <button onclick="setMode('dilse', this)" class="pill">❤️ Dil Se</button>
      <button onclick="setMode('study', this)" class="pill study-pill">📚 Study Buddy</button>
      <button onclick="setMode('bhai', this)" class="pill">🤝 Real Talk</button>
      <button onclick="setMode('hype', this)" class="pill">⚡ Hype Up</button>
      <button onclick="setMode('roast', this)" class="pill">🔥 Roast</button>
      <button onclick="setMode('gossip', this)" class="pill">🚨 Gossip</button>
    </div>

    <!-- Study Workspace Header (Isolated Mode) -->
    <div id="studyTopBar" class="study-top-bar">
      <span>📐 <b>Study Buddy Workspace</b> (Clean Q&A & Concept Solver)</span>
      <span style="font-size: 11px; opacity: 0.8;">Isolated History</span>
    </div>

    <!-- Main Interactive Card -->
    <div class="main-glass-card">

      <!-- 3D Avatar Stage -->
      <div class="stage-room voice-mode-stage" id="stageRoom">
        <model-viewer id="pikuModel" src="character.glb" alt="Piku Companion" shadow-intensity="1"></model-viewer>
        <div class="glowing-oval"></div>
      </div>

      <!-- Chat Container -->
      <div class="chat-box" id="chatBox" style="display: none;">
        <div class="msg-row">
          <div class="msg bot" id="welcomeMsg">Welcome to dilseSuno. Kaho, kya scene hai?</div>
        </div>
      </div>

      <!-- Thinking Indicator -->
      <div class="thinking-bubble" id="thinkingBubble">
        <span>Piku is thinking</span>
        <span class="dot-flashing"></span>
      </div>

      <!-- Input Controls -->
      <div class="input-wrapper" id="inputArea" style="display: none;">
        
        <div id="attachedPreview" class="attached-preview-box">
          <span id="previewName">📷 Photo attached</span>
          <span class="remove-img-btn" onclick="clearAttachedImage()">✕</span>
        </div>

        <div class="input-area">
          <!-- 1. Direct Camera Button (Mobile live camera trigger) -->
          <button type="button" class="action-icon-btn" title="Click Photo" onclick="document.getElementById('cameraCaptureInput').click()">📸</button>
          <input type="file" id="cameraCaptureInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageSelection(event)">

          <!-- 2. Gallery Button -->
          <button type="button" class="action-icon-btn" title="Upload from Files/Gallery" onclick="document.getElementById('galleryInput').click()">🖼️</button>
          <input type="file" id="galleryInput" accept="image/*" style="display:none;" onchange="handleImageSelection(event)">

          <input type="text" id="userInput" placeholder="Type or vent anything..." onkeypress="handleKeyPress(event)">
          <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
      </div>

      <!-- Voice Mode Button -->
      <div class="voice-talk-btn-container" id="voiceTalkContainer" style="display: block;">
        <button class="tap-to-talk-btn" onclick="triggerVoiceInput()">Tap to Talk to Piku 🎙️</button>
      </div>

    </div>

    <footer>
      Piku is your personal 24/7 AI companion. Real emotions, real support.
      <br><a href="#">Terms & Privacy</a>
    </footer>

  </div>

  <script>
    // 1. Moving Stars Background Canvas
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.floor((canvas.width * canvas.height) / 2800);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          alpha: Math.random()
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';

      stars.forEach(s => {
        s.x += s.vx;
        s.y += s.vy;
        if (s.x < 0) s.x = canvas.width;
        if (s.x > canvas.width) s.x = 0;
        if (s.y < 0) s.y = canvas.height;
        if (s.y > canvas.height) s.y = 0;

        ctx.globalAlpha = s.alpha;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    animateStars();

    // 2. State & Workspaces
    let currentMode = 'voice';
    let voiceState = true;
    let selectedImageBase64 = null;
    let selectedImageMime = 'image/jpeg';

    // Isolated memory queues to prevent chat bleeding
    let emotionalHistoryHTML = '';
    let studyHistoryHTML = '<div class="msg-row"><div class="msg bot study-bot-msg">Study Buddy active hai! Koi bhi concept, maths problem ya photo bhejo, simple step-by-step solve karte hain. 📚</div></div>';

    // Online counter ticker
    setInterval(() => {
      document.getElementById('onlineCount').innerText = Math.floor(Math.random() * (48 - 25 + 1)) + 25;
    }, 5000);

    // Initial greeting (Safe & non-intrusive)
    function initGreeting() {
      const name = localStorage.getItem('piku_name') || localStorage.getItem('piku_nickname');
      const welcome = document.getElementById('welcomeMsg');
      if (name) {
        welcome.innerText = `Aur ${name}! Kaisa hai bhai? Kya chal raha hai aaj?`;
      }
      emotionalHistoryHTML = document.getElementById('chatBox').innerHTML;
    }
    initGreeting();

    // Vent Streak
    function initStreak() {
      const lastVisit = localStorage.getItem('piku_last_vent');
      const today = new Date().toDateString();
      let streak = parseInt(localStorage.getItem('piku_streak') || '1');

      if (lastVisit && lastVisit !== today) {
        const yesterday = new Date(Date.now() - 86400000).toDateString();
        streak = (lastVisit === yesterday) ? streak + 1 : 1;
        localStorage.setItem('piku_streak', streak);
      }
      localStorage.setItem('piku_last_vent', today);
      document.getElementById('streakBadge').innerText = `🔥 ${streak}-Day Vent Streak`;
    }
    initStreak();

    // 3. Mode Switching & Workspace Isolation
    function setMode(mode, btn) {
      const prevMode = currentMode;
      currentMode = mode;

      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const stageRoom = document.getElementById('stageRoom');
      const chatBox = document.getElementById('chatBox');
      const inputArea = document.getElementById('inputArea');
      const voiceTalkContainer = document.getElementById('voiceTalkContainer');
      const studyTopBar = document.getElementById('studyTopBar');

      // Preserve chat history between normal & isolated study workspaces
      if (prevMode === 'study' && mode !== 'study') {
        studyHistoryHTML = chatBox.innerHTML;
        chatBox.innerHTML = emotionalHistoryHTML;
      } else if (prevMode !== 'study' && mode === 'study') {
        emotionalHistoryHTML = chatBox.innerHTML;
        chatBox.innerHTML = studyHistoryHTML;
      }

      if (mode === 'voice') {
        stageRoom.className = "stage-room voice-mode-stage";
        chatBox.style.display = 'none';
        inputArea.style.display = 'none';
        voiceTalkContainer.style.display = 'block';
        studyTopBar.style.display = 'none';
        chatBox.classList.remove('study-expanded');
      } else if (mode === 'study') {
        stageRoom.className = "stage-room study-compact";
        chatBox.style.display = 'flex';
        inputArea.style.display = 'flex';
        voiceTalkContainer.style.display = 'none';
        studyTopBar.style.display = 'flex';
        chatBox.classList.add('study-expanded');
      } else {
        stageRoom.className = "stage-room";
        chatBox.style.display = 'flex';
        inputArea.style.display = 'flex';
        voiceTalkContainer.style.display = 'none';
        studyTopBar.style.display = 'none';
        chatBox.classList.remove('study-expanded');
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 4. Natural Voice Engine (Male Tone, Zero Squeakiness, Clean Audio)
    function speakText(cleanAudioText) {
      if (!('speechSynthesis' in window) || !voiceState) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(cleanAudioText);
      utterance.lang = 'hi-IN';
      utterance.rate = 1.03;  // Natural conversational speed
      utterance.pitch = 0.98; // Natural male tone register (no high-pitched child voice)

      const voices = window.speechSynthesis.getVoices();
      // Select best natural male / Hindi voice
      const preferredVoice = voices.find(v => 
        (v.name.toLowerCase().includes('madhur') || v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('hindi') || v.lang.includes('hi')) &&
        !v.name.toLowerCase().includes('female') && !v.name.toLowerCase().includes('zira')
      ) || voices.find(v => v.lang.includes('hi') || v.lang.includes('en-IN'));

      if (preferredVoice) utterance.voice = preferredVoice;

      const stageRoom = document.getElementById('stageRoom');
      utterance.onstart = () => stageRoom.classList.add('speaking');
      utterance.onend = () => stageRoom.classList.remove('speaking');
      utterance.onerror = () => stageRoom.classList.remove('speaking');

      setTimeout(() => {
        window.speechSynthesis.speak(utterance);
      }, 50);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // 5. Image Handlers (Camera & Gallery)
    function handleImageSelection(e) {
      const file = e.target.files[0];
      if (!file) return;

      selectedImageMime = file.type || 'image/jpeg';
      const reader = new FileReader();
      reader.onload = function(evt) {
        selectedImageBase64 = evt.target.result;
        document.getElementById('previewName').innerText = "📷 " + (file.name || "Photo Ready");
        document.getElementById('attachedPreview').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearAttachedImage() {
      selectedImageBase64 = null;
      document.getElementById('cameraCaptureInput').value = '';
      document.getElementById('galleryInput').value = '';
      document.getElementById('attachedPreview').style.display = 'none';
    }

    // 6. Voice Recognition
    function triggerVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition support is unavailable. Please type your message.");
        return;
      }

      const rec = new SpeechRecognition();
      rec.lang = 'hi-IN';
      rec.interimResults = false;

      const btn = document.querySelector('.tap-to-talk-btn');
      btn.innerText = "Listening... Speak now 🎙️";

      rec.start();

      rec.onresult = (evt) => {
        btn.innerText = "Tap to Talk to Piku 🎙️";
        const spoken = evt.results[0][0].transcript;
        processMessage(spoken);
      };

      rec.onerror = () => {
        btn.innerText = "Tap to Talk to Piku 🎙️";
      };
    }

    // 7. Messaging, Edit Pencil Hook, and DOM Updates
    function addMessage(text, sender, isCrisis = false, imgSrc = null) {
      const chatBox = document.getElementById('chatBox');
      const row = document.createElement('div');
      row.className = `msg-row ${sender === 'user' ? 'user-row' : ''}`;

      // Edit button for user messages
      if (sender === 'user') {
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-btn';
        editBtn.title = 'Edit message';
        editBtn.innerHTML = '✏️';
        editBtn.onclick = () => {
          document.getElementById('userInput').value = text;
          document.getElementById('userInput').focus();
        };
        row.appendChild(editBtn);
      }

      const msg = document.createElement('div');
      const isStudyMode = (currentMode === 'study' && sender === 'bot');
      msg.className = `msg ${sender} ${isCrisis ? 'crisis' : ''} ${isStudyMode ? 'study-bot-msg' : ''}`;

      if (imgSrc) {
        const img = document.createElement('img');
        img.src = imgSrc;
        img.className = 'chat-img-thumb';
        msg.appendChild(img);
      }

      const txtSpan = document.createElement('span');
      txtSpan.innerText = text;
      msg.appendChild(txtSpan);

      row.appendChild(msg);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text && !selectedImageBase64) return;

      const attached = selectedImageBase64;
      addMessage(text || "Please solve this image!", 'user', false, attached);

      input.value = '';
      clearAttachedImage();

      processMessage(text, attached);
    }

    async function processMessage(text, attachedImg = null) {
      const thinking = document.getElementById('thinkingBubble');
      thinking.style.display = 'flex';

      const userProfile = {
        name: localStorage.getItem('piku_name') || '',
        nickname: localStorage.getItem('piku_nickname') || ''
      };

      const effectiveMode = (currentMode === 'voice') ? 'dilse' : currentMode;
      const lastContext = (currentMode === 'study') ? '' : (localStorage.getItem('piku_last_context') || '');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            mode: effectiveMode,
            lastContext: lastContext,
            userProfile: userProfile,
            voiceEnabled: voiceState,
            imageBase64: attachedImg,
            imageMimeType: selectedImageMime
          })
        });

        thinking.style.display = 'none';

        const data = await res.json();
        if (data.error) {
          addMessage("Network thoda sa hila, wapas bhej na? 🫂", 'bot');
          return;
        }

        addMessage(data.text, 'bot', data.isCrisis);

        // Save memory quietly
        if (data.extractedName && data.extractedName !== 'Unknown') {
          localStorage.setItem('piku_name', data.extractedName);
        }
        if (data.nickname && data.nickname !== 'Not set') {
          localStorage.setItem('piku_nickname', data.nickname);
        }
        if (data.memoryTopic && currentMode !== 'study') {
          localStorage.setItem('piku_last_context', data.memoryTopic);
        }

        voiceState = data.voiceEnabled;

        // Speak clean text without lag
        if (voiceState) {
          speakText(data.voiceText || data.text);
        } else {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          document.getElementById('stageRoom').classList.remove('speaking');
        }

      } catch (err) {
        thinking.style.display = 'none';
        addMessage("Glitch hua thoda, ek baar firse bolo! 🫂", 'bot');
      }
    }
  </script>
</body>
</html>
